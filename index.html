function ring(sec, goalMin){
  const frac = Math.min(1, sec / (goalMin * 60));
  const r = 38, c = 2 * Math.PI * r, mins = Math.floor(sec / 60);
  const off = c * (1 - frac);
  const svg = '<svg class="ring" viewBox="0 0 92 92" role="img" aria-label="' + mins + ' of ' + goalMin + ' minutes tonight">' +
    '<circle cx="46" cy="46" r="' + r + '" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="7"/>' +
    '<circle class="arc" cx="46" cy="46" r="' + r + '" fill="none" stroke="var(--gold)" stroke-width="7" stroke-linecap="round" stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + (reduceMotion() ? off : c).toFixed(1) + '" data-off="' + off.toFixed(1) + '" transform="rotate(-90 46 46)"' + (frac < 0.02 ? ' opacity="0"' : '') + '/>' +
    '<text x="46" y="50" text-anchor="middle" class="t">' + mins + '</text>' +
    '<text x="46" y="65" text-anchor="middle" class="s">of ' + goalMin + ' min</text></svg>';
  const el = h('div', {html: svg});
  if(!reduceMotion()) requestAnimationFrame(() => requestAnimationFrame(() => { const a = el.querySelector('.arc'); if(a) a.setAttribute('stroke-dashoffset', a.dataset.off); }));
  return el;
}

function pasteBox(idPrefix, onRestored){
  const ta = h('textarea', {class:'codebox', id: idPrefix + 'In', 'aria-label':'Paste a code', placeholder:'Paste the code or the whole report here', autocapitalize:'off', autocorrect:'off', spellcheck:'false', style:'min-height:96px'});

  const go = async () => {
    msg.textContent = ''; msg.className = 'status'; conf.innerHTML = '';
    const t = ta.value.trim();
    if(!t){ ta.focus(); return; }
    if(/WQT\.[A-Za-z0-9_-]+/.test(t)){
      try{
        const o = C.readTeacherCode(t);
        const done = C.applyTeacher(state, o, K());
        save();
        msg.className = 'status ok';
        msg.textContent = done.length ? 'Changes from Jonathan: ' + done.join(', ') + '.' : 'This code had no changes.';
        ta.value = '';
      }catch(e){ msg.className = 'status no'; msg.textContent = 'That code could not be read. Copy the whole code and try again.'; }
      return;
    }
    if(/WQ(0|1|2r|2)\.[A-Za-z0-9_-]+/.test(t)){
      let st;
      try{ st = await C.readCode(t); }
      catch(e){ msg.className = 'status no'; msg.textContent = e && e.message === 'nodecomp' ? 'This browser cannot read the code. Try another browser.' : 'That code could not be read. Copy the whole code and try again.'; return; }

        h('div', {class:'btnrow'},

          btn('line', 'Cancel', () => { conf.innerHTML = ''; }, {id: idPrefix + 'Cancel'}))));

    msg.className = 'status no'; msg.textContent = 'That does not look like a Word Quest code.';

  return h('div', {class:'stack tight'}, ta, btn('primary block', 'Use this code', go, {id: idPrefix + 'Go'}), conf, msg);
}

/* ============ Speed round (v1) ============ */
let speed = null;
function viewSpeed(main){
  const pool = C.started(state);
  if(pool.length < 4){ main.append(h('p', null, 'The speed round opens after your first night.'), btn('ghost block', 'Back', () => show('home'))); return; }
  if(!speed || speed.over){
    main.append(h('div', {class:'stack fade-in'},
      h('div', {class:'band'}, h('div', {class:'eyebrow'}, 'Speed round'), h('h2', null, '60 seconds'),
        h('p', {class:'plan', style:'margin-top:8px'}, 'Pick the word with the same meaning. Your best so far: ' + state.speed.best + '.')),
      btn('gold block big', speed && speed.over ? 'Play again' : 'Go', () => { speed = {score:0, wrong:[], t0: Date.now(), over:false, pool}; show('speed'); }, {id:'btnGo'}),
      speed && speed.over ? speedResult() : null,
      btn('ghost block', 'Back to Tonight', () => { speed = null; show('home'); }, {id:'btnSpeedBack'})));
    return;
  }
  const left = Math.max(0, 60 - Math.floor((Date.now() - speed.t0) / 1000));
  let w = C.pick(speed.pool);
  if(w === speed.lastW) w = C.pick(speed.pool.filter(x => x !== speed.lastW));
  speed.lastW = w;
  const e = C.BY.get(w);
  const useRev = C.rng() < 0.5;
  const q = useRev ? e.rev : e.syn;
  const stem = useRev ? e.rev.stem : e.word.toUpperCase();
  cur = {item:{t:'speed'}, answer: q.answer};
  const area = h('div', {class:'stack', id:'qArea'});
  area.append(h('div', {class:'sbar'}, btn('ghost', 'Stop', () => { endSpeed(); }, {id:'btnSpeedStop'}), h('div', {class:'grow'}),
    h('span', {class:'chip num', id:'spLeft', 'aria-label':'Seconds left'}, left + 's'), h('span', {class:'chip num'}, 'Score ' + speed.score)));
  area.append(h('p', {class:'prompt'}, 'Same as'), h('div', {class:'big'}, stem));
  const P = {choices: C.shuffle(q.choices).map(c => ({v:c, label:c}))};
  const list = choiceList(P, (c, b) => {
    if(speed.lock) return; speed.lock = true;
    const ok = c.v === q.answer;
    b.classList.add(ok ? 'right' : 'wrong');
    if(!ok){ b.querySelector('.mark').innerHTML = ICON.cross; const r = list.querySelector('[data-v="' + CSS.escape(q.answer) + '"]'); if(r) r.classList.add('right'); }
    if(ok) speed.score++; else speed.wrong.push([stem, q.answer, c.v]);
    setTimeout(() => { if(!speed) return; speed.lock = false; if(Date.now() - speed.t0 >= 60000) endSpeed(); else show('speed'); }, ok ? 220 : 800);
  });
  area.append(list);
  main.append(area);
  clearInterval(speed.iv);
  speed.iv = setInterval(() => {
    if(!speed) return;
    const l = Math.max(0, 60 - Math.floor((Date.now() - speed.t0) / 1000));
    const el = $('#spLeft'); if(el) el.textContent = l + 's';
    if(l <= 0 && !speed.lock) endSpeed();
  }, 250);
}
function endSpeed(){
  if(!speed || speed.over) return;
  clearInterval(speed.iv);
  speed.over = true;
  state.speed.runs = (state.speed.runs || 0) + 1;
  if(speed.score > state.speed.best){ state.speed.best = speed.score; state.speed.bestDay = K(); speed.record = true; }
  save(); show('speed');
}
function speedResult(){
  return h('div', {class:'card stack tight', id:'speedResult'},
    h('div', {class:'lbl'}, 'Last round'),
    h('div', {class:'meaning'}, speed.score + ' right' + (speed.record ? '. A new best.' : '.')),
    speed.wrong.length ? h('div', {class:'small stack tight'}, speed.wrong.slice(0, 8).map(x => h('div', null, x[0] + ' means ' + x[1] + '. You picked ' + x[2] + '.'))) : null);

  wrap.append(h('div', {class:'card stack tight'}, h('div', {class:'lbl'}, 'Tricky words'),
    tricky.length ? h('div', {class:'wlist'}, tricky.map(w => h('button', {type:'button', class:'wrow', onclick: () => openWord(w)}, h('span', {class:'w'}, w, h('span', null, C.BY.get(w).meaning)), h('span', {class:'tier'}, 'missed ' + st.words[w].x))))
      : h('p', {class:'muted'}, 'No missed words yet.')));
  const traps = C.trapWords(st);
  wrap.append(h('div', {class:'card stack tight'}, h('div', {class:'lbl'}, 'Look-alike traps'),
    traps.length ? [h('div', {class:'wlist'}, traps.slice(0, 8).map(w => { const e = C.BY.get(w); return h('button', {type:'button', class:'wrow', onclick: () => openWord(w)}, h('span', {class:'w'}, w, h('span', null, 'Mixed up with ' + (e.not ? e.not.word : 'its look-alike') + '.')), h('span', {class:'tier'}, plural(st.words[w].trap, 'time'))); })),
      h('p', {class:'muted small'}, 'When a choice looks like the word, check its meaning.')]
      : h('p', {class:'muted'}, 'None so far.')));
  wrap.append(h('div', {class:'card row between'}, h('div', null, h('div', {class:'lbl'}, 'Speed round'), h('p', {class:'small muted'}, plural(st.speed.runs || 0, 'round') + ' played')),
    h('div', {class:'bigstat', style:'font-size:30px'}, String(st.speed.best))));
  main.append(wrap);
}
function minutesChart(st, k){
  const Wd = 320, H = 140, padL = 26, padB = 22, n = 14;
  const vals = [], labels = [];
  for(let i = n - 1; i >= 0; i--){ const d = C.addDays(k, -i); vals.push(st.days[d] ? st.days[d].sec / 60 : 0); labels.push(d); }
  const goal = (st.settings && st.settings.goal) || 10;
  const max = Math.max(goal + 5, Math.ceil(Math.max(...vals) / 5) * 5);
  const bw = (Wd - padL - 4) / n;
  const y = v => H - padB - (H - padB - 8) * v / max;
  let s = '<svg class="chart" viewBox="0 0 ' + Wd + ' ' + H + '" role="img" aria-label="Minutes each night for the last 14 nights">';
  [0, max / 2, max].forEach(t => { const yy = y(t); s += '<line x1="' + padL + '" x2="' + Wd + '" y1="' + yy.toFixed(1) + '" y2="' + yy.toFixed(1) + '" stroke="var(--line)" stroke-width="1"/><text x="' + (padL - 6) + '" y="' + (yy + 4).toFixed(1) + '" text-anchor="end">' + Math.round(t) + '</text>'; });
  const gy = y(goal);
  s += '<line x1="' + padL + '" x2="' + Wd + '" y1="' + gy.toFixed(1) + '" y2="' + gy.toFixed(1) + '" stroke="var(--gold-ink)" stroke-dasharray="4 4" stroke-width="1.2"/>';
  vals.forEach((v, i) => {
    const x = padL + 2 + i * bw, yy = y(v), hgt = H - padB - yy;
    if(v > 0){
      const r = Math.min(4, hgt / 2, (bw - 6) / 2), x0 = x + 3, w = bw - 6, base = H - padB;
      s += '<path d="M' + x0.toFixed(1) + ' ' + base + 'V' + (yy + r).toFixed(1) + 'q0 -' + r.toFixed(1) + ' ' + r.toFixed(1) + ' -' + r.toFixed(1) + 'h' + (w - 2 * r).toFixed(1) + 'q' + r.toFixed(1) + ' 0 ' + r.toFixed(1) + ' ' + r.toFixed(1) + 'V' + base + 'z" fill="' + (v >= goal ? 'var(--gold)' : 'color-mix(in srgb, var(--gold) 50%, var(--surface-2))') + '"><title>' + fmtDay(labels[i]) + ': ' + Math.round(v) + ' min</title></path>';
    }
    if(i % 2 === 1 || i === n - 1) s += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle">' + C.keyDate(labels[i]).getDate() + '</text>';
  });
  s += '</svg>';
  return h('div', {html: s});
}

/* ============ Send ============ */
function fallbackReport(st, code, k){
  const sm = C.summary(st, k);
  return ['Word Quest report: Nina, ' + fmtDay(k, {month:'short', day:'numeric', year:'numeric'}),
    'Words started: ' + sm.started + ' of ' + sm.total + '. Nights studied: ' + sm.nights + '. Minutes: ' + sm.minutes + '.',
    '', 'Code (for Jonathan): ' + code].join('\n');
}
async function buildReport(){
  const k = K();
  const code = await C.makeCode(state, now().toISOString(), k);
  let text = null;
  if(window.WQTeacher && typeof window.WQTeacher.reportText === 'function'){
    try{ text = window.WQTeacher.reportText(state, code, k); }catch(e){ text = null; }
  }
  return text || fallbackReport(state, code, k);
}
function viewSend(main){
  const wrap = h('div', {class:'stack fade-in'});
  if(viewing){
    const box = h('div', {class:'tv-host', id:'teacherHost'});
    let ok = false;
    if(window.WQTeacher && typeof window.WQTeacher.render === 'function'){
      try{ window.WQTeacher.render(box, viewing, viewK); ok = true; }catch(e){ box.innerHTML = ''; }
    }
    if(!ok){
      const sm = C.summary(viewing, viewK);
      box.append(h('div', {class:'card stack tight'}, h('div', {class:'lbl'}, 'Report'),
        h('p', null, 'Words started: ' + sm.started + ' of ' + sm.total + '.'),
        h('p', null, 'Nights studied: ' + sm.nights + '. Minutes: ' + sm.minutes + '.'),
        h('p', null, 'Strength: ' + ['New', 'Learning', 'Growing', 'Strong'].map(t => t + ' ' + sm.tiers[t]).join(', ') + '.'),
        sm.retention30 != null ? h('p', null, 'Reviews right, last 30 days: ' + Math.round(100 * sm.retention30) + '% of ' + sm.reviews30 + '.') : null,
        h('p', {class:'muted small'}, 'Words and Progress show this report too.')));
    }
    wrap.append(box, btn('ghost block', 'Close the report', closeView, {id:'btnCloseView2'}));
    main.append(wrap);
    return;
  }
  const k = K();
  const area = h('textarea', {class:'codebox', id:'reportBox', readonly:true, 'aria-label':'Your report', rows:'6'});
  area.value = 'Making your report.';
  const status = h('p', {class:'status', id:'copyStatus', 'aria-live':'polite'});
  let text = null;
  const ready = buildReport().then(t => { text = t; area.value = t; copyBtn.disabled = false; fileBtn.disabled = false; }).catch(() => { area.value = 'The report could not be made.'; });
  const copyBtn = btn('gold block big', 'Copy my report', () => {
    if(!text) return;
    let done = false;
    const fallback = () => {
      try{ area.focus(); area.select(); area.setSelectionRange(0, text.length); done = !!(document.execCommand && document.execCommand('copy')); }catch(e){}
      status.className = 'status ' + (done ? 'ok' : '');
      status.textContent = done ? 'Copied. Paste it into an email to Jonathan.' : 'Select all the text in the box, copy it, and paste it into an email to Jonathan.';
    };
    state.lastReport = k; state.lastBackup = k; save();
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(() => { status.className = 'status ok'; status.textContent = 'Copied. Paste it into an email to Jonathan.'; }, fallback);
      } else fallback();
    }catch(e){ fallback(); }
  }, {id:'btnCopy', disabled:true});
  const fileBtn = btn('line block', 'Save a backup file', () => {
    if(!text) return;
    try{
      const blob = new Blob([text], {type:'text/plain;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const a = h('a', {href:url, download:'word-quest-backup-' + k + '.txt', style:'display:none'});
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      state.lastBackup = k; save();
      fileStatus.className = 'status ok'; fileStatus.textContent = 'Saved as word-quest-backup-' + k + '.txt.';
    }catch(e){ fileStatus.className = 'status no'; fileStatus.textContent = 'This device could not save a file. Copy the report instead.'; }
  }, {id:'btnBackup', disabled:true});
  const fileStatus = h('p', {class:'status', id:'fileStatus', 'aria-live':'polite'});
  wrap.append(h('div', {class:'card stack'},
    h('div', {class:'lbl'}, 'Send your progress to Jonathan'),
    h('p', null, 'Copy your report and paste it into an email to Jonathan.'),
    copyBtn, status, area,
    h('p', {class:'muted small'}, state.lastBackup ? 'Last backup: ' + ago(state.lastBackup, k) + '.' : 'No backup yet.')));
  wrap.append(h('div', {class:'card stack tight'},
    h('div', {class:'lbl'}, 'Backup file'),
    h('p', {class:'small'}, 'Saves the same report as a file on this device. The code at the end can bring your words back.'),
    fileBtn, fileStatus));
  wrap.append(h('div', {class:'card stack tight'},
    h('div', {class:'lbl'}, 'Paste a code'),
    h('p', {class:'small'}, 'A code from Jonathan, or a report from your other device.'),
    pasteBox('code')));
  const vin = h('textarea', {class:'codebox', id:'viewIn', 'aria-label':'Paste a report to look at', placeholder:'Paste Nina’s report here', autocapitalize:'off', autocorrect:'off', spellcheck:'false', style:'min-height:80px'});
  const vmsg = h('p', {class:'status', 'aria-live':'polite'});
  wrap.append(h('details', {class:'reread', id:'teacherBox'},
    h('summary', null, 'For Jonathan: look at a report'),
    h('div', {class:'stack tight', style:'padding:0 16px 16px'},
      h('p', {class:'small muted'}, 'Opens a report to read. Nothing on this device changes.'),
      vin, btn('line block', 'Open the report', async () => {
        vmsg.textContent = '';
        try{ await openView(vin.value); }
        catch(e){ vmsg.className = 'status no'; vmsg.textContent = e && e.message === 'nodecomp' ? 'This browser cannot read the code.' : 'That does not look like a Word Quest report.'; }
      }, {id:'btnView'}), vmsg)));
  wrap.append(h('p', {class:'foot'}, 'Word Quest ' + (META.version || '') + ' · Firat Education'));
  main.append(wrap);
  return ready;
}
async function openView(text){
  const st = await C.readCode(text);
  save();          // keep her own progress safe before switching
  viewing = st;
  viewK = C.numDay(st.__at) || K();
  timerOff();
  const b = $('#viewBanner'); b.hidden = false; b.innerHTML = '';
  b.append(h('span', {class:'grow'}, h('b', null, 'Viewing a report'), ' from ' + (st.__made ? new Date(st.__made).toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'}) : fmtDay(viewK)) + '. Nothing is saved.'),
    btn('line', 'Close', closeView, {id:'btnCloseView'}));
  show('send');
}
function closeView(){
  viewing = null; viewK = null;
  const b = $('#viewBanner'); b.hidden = true; b.innerHTML = '';
  show(state.welcomed ? 'home' : 'welcome');
}

/* ============ Settings ============ */
function segSetting(id, label, val, opts, on, hint){
  const seg = h('div', {class:'seg', role:'group', 'aria-labelledby': id + 'L', id});
  opts.forEach(([v, t]) => seg.append(h('button', {type:'button', 'aria-pressed': String(String(v) === String(val)), 'data-v': String(v), onclick: () => {
    seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === String(v))));
    on(v); save();
  }}, t)));
  return h('div', {class:'field'}, h('span', {class:'flabel', id: id + 'L'}, label), seg, hint ? h('span', {class:'hint'}, hint) : null);
}
function viewSettings(main){
  if(viewing){ show('send'); return; }
  const s = state.settings, k = K();
  const td = h('input', {type:'date', id:'setTest', value: s.testDate || '', min: k});
  td.addEventListener('change', () => { s.testDate = td.value || null; C.applyTestDate(state, K()); save(); tdMsg.textContent = s.testDate ? 'Saved.' : 'No test date.'; });
  const tdMsg = h('p', {class:'status', 'aria-live':'polite'});
  const reset = h('input', {id:'resetIn', autocapitalize:'characters', autocomplete:'off', autocorrect:'off', spellcheck:'false', placeholder:'RESET'});
  const resetMsg = h('p', {class:'status', 'aria-live':'polite'});
  const wrap = h('div', {class:'stack fade-in'},
    h('div', {class:'card stack'},
      segSetting('setGoal', 'Nightly goal', s.goal, [[10, '10 minutes'], [15, '15 minutes']], v => { s.goal = Number(v); }),
      segSetting('setNew', 'New words a night', s.newMode, [['auto', 'Automatic'], [2, '2'], [3, '3'], [4, '4'], [5, '5']], v => { s.newMode = v === 'auto' ? 'auto' : Number(v); },
        'Automatic gives fewer new words when many reviews are waiting.'),
      segSetting('setZh', 'Chinese help', s.zh, [['button', 'On demand'], ['off', 'Off']], v => { s.zh = v; }),
      voiceOK ? h('div', {class:'stack tight'},
        segSetting('setRate', 'Voice speed', s.rate, [[0.75, 'Slow'], [0.9, 'Normal'], [1, 'Fast']], v => { s.rate = Number(v); }),
        btn('line', 'Test the voice', () => speak('vigorous. The coach led a vigorous practice.'))) : h('p', {class:'muted small'}, 'This browser cannot read words aloud.'),
      segSetting('setTheme', 'Theme', s.theme, [['auto', 'Auto'], ['dark', 'Dark'], ['light', 'Light']], v => { s.theme = v; applyTheme(); }, 'Auto follows your phone.')),
    h('div', {class:'card stack tight'},
      h('div', {class:'field'}, h('label', {for:'setTest'}, 'Test date'), td, h('span', {class:'hint'}, 'Jonathan can set this for you.')),
      s.testDate ? btn('link', 'Clear the test date', () => { s.testDate = null; C.applyTestDate(state, K()); save(); show('settings'); }, {id:'btnClearTest'}) : null,
      tdMsg),
    h('div', {class:'card stack tight'},
      h('div', {class:'lbl'}, 'Start over'),
      h('p', {class:'small'}, 'Erases all progress on this device. Copy your report under Send first.'),
      h('div', {class:'field'}, h('label', {for:'resetIn'}, 'Type RESET to confirm'), reset),
      btn('line', 'Erase my progress', () => {
        if(reset.value.trim() !== 'RESET'){ resetMsg.className = 'status no'; resetMsg.textContent = 'Type RESET in the box first.'; reset.focus(); return; }
        const old = lsGet(KEY); if(old) lsSet(BEFORE_RESET, old);
        const theme = state.settings.theme;
        state = C.freshState(now().toISOString()); state.welcomed = true; state.settings.theme = theme;
        live = null; save(); show('home');
      }, {id:'btnReset'}), resetMsg),
    h('p', {class:'muted tiny center'}, 'Word list version ' + (META.version || 'dev') + ' · ' + C.BANK.length + ' words' + (META.built ? ' · built ' + META.built : '')),
    btn('ghost block', 'Done', () => show('home'), {id:'btnSettingsDone'}));
  main.append(wrap);
}

/* ============ navigation ============ */
let tab = 'home';
const TITLES = {home:'Word Quest', words:'Words', progress:'Progress', send:'Send', settings:'Settings', welcome:'Word Quest', speed:'Speed round', session:'Tonight'};
const views = {home:viewHome, session:viewSession, words:viewWords, progress:viewProgress, send:viewSend, speed:viewSpeed, settings:viewSettings, welcome:viewWelcome};
function setNav(){
  const map = {home:['Tonight', ICON.moon], words:['Words', ICON.book], progress:['Progress', ICON.chart], send:['Send', ICON.send]};
  for(const t in map){
    const b = document.querySelector('[data-tab="' + t + '"]');
    b.innerHTML = map[t][1] + '<span>' + map[t][0] + '</span>';
    if(tab === t) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    b.onclick = () => show(t);
  }
}
let showing = false, pendingShow = null;
function show(name){
  if(!views[name]) name = 'home';
  if(showing){ pendingShow = name; return; }      // a view asked for another view while rendering
  showing = true;
  try{
    if(name !== 'speed' && speed && !speed.over){ clearInterval(speed.iv); speed = null; }
    closeSheet();
    tab = name;
    const main = $('#main'); main.innerHTML = '';
    if(name !== 'session') cur = null;
    if((name === 'session' || name === 'speed') && !viewing) timerOn(); else timerOff();
    const noNav = name === 'welcome' || name === 'session' || name === 'speed';
    document.getElementById('nav').hidden = noNav;
    document.body.classList.toggle('nonav', noNav);
    document.body.classList.toggle('nohead', name === 'session');
    $('#title').textContent = TITLES[name] || 'Word Quest';
    $('#btnSettings').hidden = !(name === 'home' && !viewing);
    views[name](main);
    setNav();
  } finally { showing = false; }
  if(pendingShow){ const p = pendingShow; pendingShow = null; show(p); return; }
  window.scrollTo(0, 0);
}

/* ============ keyboard ============ */
document.addEventListener('keydown', ev => {
  if(ev.key === 'Escape' && document.querySelector('.modal')){ closeSheet(); return; }
  if(tab !== 'session' && tab !== 'speed') return;
  if(ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const ae = document.activeElement, typing = ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA');
  if(ev.key === 'Enter' && !typing){
    if(ae && ae.tagName === 'BUTTON') return;      // the focused button handles Enter itself
    const nb = $('#btnNext') || $('#btnGotIt') || $('#btnRead') || $('#btnLesson');
    if(nb){ ev.preventDefault(); nb.click(); }
    return;
  }
  if(!typing && /^[1-4a-dA-D]$/.test(ev.key)){
    const i = /[1-4]/.test(ev.key) ? Number(ev.key) - 1 : 'abcd'.indexOf(ev.key.toLowerCase());
    const cs = [...document.querySelectorAll('#qArea .choice')].filter(x => !x.disabled);
    if(cs.length && cs.length === document.querySelectorAll('#qArea .choice').length && cs[i]){ ev.preventDefault(); cs[i].click(); }
  }
});

/* ============ start ============ */
document.getElementById('btnSettings').innerHTML = ICON.gear;
document.getElementById('btnSettings').onclick = () => { if(!viewing) show('settings'); };
document.getElementById('storageWarn').hidden = storageOK;
applyTheme();
try{ window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme); }catch(e){}
if(voiceOK){ try{ window.speechSynthesis.getVoices(); window.speechSynthesis.addEventListener('voiceschanged', () => {}); }catch(e){} }
window.addEventListener('pointerdown', function once(){
  window.removeEventListener('pointerdown', once);
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); }catch(e){}
});
if(!TESTING && location.protocol === 'https:' && 'serviceWorker' in navigator){
  try{ navigator.serviceWorker.register('sw.js').catch(() => {}); }catch(e){}
}
show(state.welcomed ? 'home' : 'welcome');

window.__WQ = {
  get state(){ return state; },
  set state(v){ state = C.normalize(v); live = C.sessionOpen(state, K()) ? state.session : null; },
  core: C, save, show, startNight, k: () => K(),
  get session(){ return live; },
  get current(){ return cur && live ? {item: live.q[live.pos], answer: cur.answer, phase: cur.phase || null, pos: live.pos} : (cur && tab === 'speed' ? {item: cur.item, answer: cur.answer} : null); },
  get tab(){ return tab; },
  get viewing(){ return viewing; }
};
})();
