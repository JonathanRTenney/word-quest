<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Quest</title>
<meta name="description" content="Nina's nightly words">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#F2F4FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1027" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Word Quest">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<style>
/* Fonts are served from this site's own fonts folder: no request goes to any other site, and they work offline. */
@font-face{ font-family:"Cinzel"; font-style:normal; font-weight:600; font-display:swap; src:url("fonts/cinzel-latin-600-normal.woff2") format("woff2"); }
@font-face{ font-family:"Cinzel"; font-style:normal; font-weight:700; font-display:swap; src:url("fonts/cinzel-latin-700-normal.woff2") format("woff2"); }
@font-face{ font-family:"Atkinson Hyperlegible"; font-style:normal; font-weight:400; font-display:swap; src:url("fonts/atkinson-hyperlegible-latin-400-normal.woff2") format("woff2"); }
@font-face{ font-family:"Atkinson Hyperlegible"; font-style:normal; font-weight:700; font-display:swap; src:url("fonts/atkinson-hyperlegible-latin-700-normal.woff2") format("woff2"); }
@font-face{ font-family:"Atkinson Hyperlegible"; font-style:italic; font-weight:400; font-display:swap; src:url("fonts/atkinson-hyperlegible-latin-400-italic.woff2") format("woff2"); }
/* Word Quest v2. One phone-width column, a night-sky band on Tonight, quiet cards below, a bottom tab bar.
   Colors live only in the tokens below (light set, dark set). teacher.css uses the same names. */
:root{
  --bg:#F2F3F9; --surface:#FFFFFF; --surface-2:#E7EAF5; --ink:#1A1E3C; --muted:#565D80; --line:#D5D9EA;
  --night:#1B2152; --night-2:#2D3577; --on-night:#F4F1E4; --on-night-muted:#C5C8E6;
  --gold:#E3AE3B; --gold-soft:#F6E3B4; --gold-ink:#835500; --on-gold:#1A1E3C;
  --good:#1B7A50; --good-bg:#E2F2EA; --bad:#B23A33; --bad-bg:#FAE7E5; --warn-bg:#FBF0D3; --warn-ink:#6E4B00;
  --pos:#1B7A50; --neg:#B23A33; --neu:#565D80;
  --focus:#3B4FD8; --shadow:0 1px 2px rgba(26,30,60,.06), 0 4px 16px rgba(26,30,60,.05);
  --font-display:"Cinzel", "Trajan Pro", Georgia, "Times New Roman", serif;
  --font-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --radius:16px; --tap:48px;
  --navh:64px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1027; --surface:#161935; --surface-2:#20244A; --ink:#E3E4F1; --muted:#A3A7C8; --line:#2B2F5C;
    --night:#0A0C21; --night-2:#1A1F4E; --on-night:#EDE9DA; --on-night-muted:#B3B6D8;
    --gold:#E2BC62; --gold-soft:#3A3220; --gold-ink:#E9C673; --on-gold:#17193A;
    --good:#62C49A; --good-bg:#132E26; --bad:#EE9088; --bad-bg:#35202A; --warn-bg:#2F2918; --warn-ink:#E9C673;
    --pos:#62C49A; --neg:#EE9088; --neu:#A3A7C8; --focus:#A8B5FF; --shadow:none;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1027; --surface:#161935; --surface-2:#20244A; --ink:#E3E4F1; --muted:#A3A7C8; --line:#2B2F5C;
  --night:#0A0C21; --night-2:#1A1F4E; --on-night:#EDE9DA; --on-night-muted:#B3B6D8;
  --gold:#E2BC62; --gold-soft:#3A3220; --gold-ink:#E9C673; --on-gold:#17193A;
  --good:#62C49A; --good-bg:#132E26; --bad:#EE9088; --bad-bg:#35202A; --warn-bg:#2F2918; --warn-ink:#E9C673;
  --pos:#62C49A; --neg:#EE9088; --neu:#A3A7C8; --focus:#A8B5FF; --shadow:none;
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{background:var(--bg);margin:0}
body{color:var(--ink);font-family:var(--font-body);font-size:18px;line-height:1.55;overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
  padding-left:max(20px, env(safe-area-inset-left, 0px));padding-right:max(20px, env(safe-area-inset-right, 0px));
  padding-top:env(safe-area-inset-top, 0px);
  padding-bottom:calc(var(--navh) + 28px + env(safe-area-inset-bottom, 0px));}
body.nonav{padding-bottom:calc(32px + env(safe-area-inset-bottom, 0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto}
main{outline:none}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:8px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:700}
p{margin:0}
ol,ul{margin:0}
.skip{position:absolute;left:-999px;top:8px;background:var(--surface);padding:8px 12px;border-radius:8px;z-index:30}
.skip:focus{left:12px}
.muted{color:var(--muted)}
.small{font-size:15.5px}
.tiny{font-size:13.5px}
.num{font-variant-numeric:tabular-nums}
.center{text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.top{display:flex;align-items:center;gap:12px;min-height:64px;padding:12px 0 8px}
.title{flex:1;font-family:var(--font-display);font-weight:700;font-size:21px;letter-spacing:.09em;text-transform:uppercase}
.iconbtn{border:0;background:transparent;color:var(--muted);width:var(--tap);height:var(--tap);border-radius:14px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.iconbtn svg{width:24px;height:24px}
body.nohead .top{display:none}

/* building blocks */
.stack{display:flex;flex-direction:column;gap:16px}
.stack.tight{gap:10px}
.stack.loose{gap:22px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.nowrap{flex-wrap:nowrap}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none}
.lbl{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.section{font-family:var(--font-display);font-size:15px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:10px 0 -4px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 11px;font-size:15px;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .chip{font-size:16px;padding:5px 12px}
button.chip{border:0;cursor:pointer;min-height:40px}
button.chip[aria-pressed="true"]{background:var(--gold);color:var(--on-gold)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.tile .v{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.tile .l{font-size:14.5px;color:var(--muted);line-height:1.3}

/* buttons */
.btn{border:0;border-radius:14px;padding:12px 20px;font-weight:700;cursor:pointer;min-height:var(--tap);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;line-height:1.25;text-align:center}
.btn.gold{background:var(--gold);color:var(--on-gold)}
.btn.gold:hover{filter:brightness(1.04)}
.btn.primary{background:var(--night-2);color:var(--on-night)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.line:hover{border-color:var(--muted)}
.btn.link{background:none;color:var(--ink);text-decoration:underline;text-underline-offset:3px;padding:10px 6px;font-weight:700}
.btn.block{width:100%}
.btn.big{min-height:58px;font-size:20px;border-radius:16px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:10px}
.btnrow > *{flex:1}

/* the night band */
.band{position:relative;overflow:hidden;color:var(--on-night);border-radius:22px;padding:22px 20px 20px;
  background:
    radial-gradient(1.4px 1.4px at 9% 18%, rgba(255,255,255,.8) 50%, transparent 51%),
    radial-gradient(1px 1px at 24% 64%, rgba(255,255,255,.55) 50%, transparent 51%),
    radial-gradient(1.2px 1.2px at 41% 12%, rgba(255,255,255,.6) 50%, transparent 51%),
    radial-gradient(1px 1px at 57% 34%, rgba(255,255,255,.45) 50%, transparent 51%),
    radial-gradient(1.4px 1.4px at 73% 16%, rgba(255,255,255,.7) 50%, transparent 51%),
    radial-gradient(1px 1px at 88% 44%, rgba(255,255,255,.5) 50%, transparent 51%),
    radial-gradient(1.2px 1.2px at 94% 82%, rgba(255,255,255,.55) 50%, transparent 51%),
    radial-gradient(1px 1px at 33% 90%, rgba(255,255,255,.4) 50%, transparent 51%),
    radial-gradient(120% 90% at 100% 0%, rgba(233,190,95,.16), transparent 55%),
    linear-gradient(165deg, var(--night-2), var(--night));}
.band .eyebrow{font-size:13.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--on-night-muted)}
.band h2{font-family:var(--font-display);font-size:27px;letter-spacing:.03em;margin:4px 0 0;line-height:1.2}
.band .plan{color:var(--on-night-muted);font-size:16.5px;line-height:1.45}
.band .plan b{color:var(--on-night);font-weight:700}
.band .ringrow{display:flex;gap:18px;align-items:center;margin:16px 0 18px}
.band .btn.gold{box-shadow:0 6px 18px rgba(0,0,0,.25)}
.band .btn.link{color:var(--on-night)}
.ring{width:92px;height:92px;flex:none;display:block}
.ring .t{font-size:24px;font-weight:700;fill:var(--on-night);font-family:var(--font-body)}
.ring .s{font-size:10.5px;fill:var(--on-night-muted);font-family:var(--font-body)}
.ring .arc{transition:stroke-dashoffset 1.1s cubic-bezier(.3,.7,.2,1)}
.moon{position:absolute;right:22px;top:20px;width:30px;height:30px;border-radius:50%;pointer-events:none;
  box-shadow:inset -8px 5px 0 0 rgba(246,227,180,.85);filter:drop-shadow(0 0 10px rgba(246,227,180,.25));transform:rotate(-12deg)}

/* week dots */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.week .d{text-align:center;font-size:13px;color:var(--muted)}
.week .dot{width:30px;height:30px;border-radius:50%;margin:6px auto 0;border:2px solid var(--line);display:grid;place-items:center;color:var(--on-gold)}
.week .dot.on{background:var(--gold);border-color:var(--gold)}
.week .dot.today{border-color:var(--gold-ink)}
.week .dot svg{width:15px;height:15px}

/* banners */
.banner{border-radius:14px;padding:13px 15px;font-size:16px;line-height:1.45}
.banner.warn{background:var(--warn-bg);color:var(--warn-ink)}
.banner.bad{background:var(--bad-bg);color:var(--bad);margin:4px 0 12px}
.banner.good{background:var(--good-bg);color:var(--good)}
.banner.view{background:var(--warn-bg);color:var(--warn-ink);display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 14px}
.banner.view .btn{min-height:44px;padding:8px 14px}
.note{border-left:4px solid var(--gold);background:var(--surface)}
.note .text{white-space:pre-wrap}

/* session */
.sbar{display:flex;align-items:center;gap:12px;padding:14px 0 18px}
.sbar .btn{min-height:44px;padding:8px 14px;font-size:16px}
.sbar .prog{flex:1;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.sbar .prog i{display:block;height:100%;background:var(--gold);border-radius:99px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted);min-width:44px;text-align:right}
.kind{font-size:13.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.headword{font-weight:700;font-size:38px;letter-spacing:.01em;line-height:1.12;word-break:break-word}
.big{font-size:32px;font-weight:700;letter-spacing:.04em;line-height:1.2;word-break:break-word}
.say{color:var(--muted);font-size:16px}
.nb{white-space:nowrap}
.ways .btn{min-width:112px}
#doneScreen{padding-top:18px}
.prompt{font-size:18px;color:var(--muted)}
.sign{display:inline-flex;align-items:center;gap:4px;font-size:14.5px;font-weight:700;border-radius:999px;padding:2px 11px;border:1.5px solid currentColor;white-space:nowrap}
.sign.p{color:var(--pos)} .sign.n{color:var(--neg)} .sign.z{color:var(--neu)}
.meaning{font-size:22px;font-weight:700;line-height:1.35}
.example{font-style:italic}
.example b,.sentence b{font-style:normal;color:var(--gold-ink)}
.sentence{font-size:20px;line-height:1.55}
.blank{display:inline-block;min-width:84px;border-bottom:2.5px solid var(--ink);margin:0 3px;transform:translateY(-3px)}
.speak{border:0;background:var(--surface-2);color:var(--ink);border-radius:999px;width:var(--tap);height:var(--tap);display:inline-grid;place-items:center;cursor:pointer;flex:none}
.speak svg{width:22px;height:22px}
.contrast{border-left:4px solid var(--muted);background:var(--surface-2);border-radius:10px;padding:10px 12px}
.trap{border-left:4px solid var(--bad);background:var(--bad-bg);border-radius:10px;padding:10px 12px}
.trap b{color:var(--bad)}
.zh{font-size:21px}
.syns{display:flex;flex-wrap:wrap;gap:6px}
.syns span{background:var(--surface-2);border-radius:8px;padding:3px 10px}
.aloud{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:16px}
.aloud svg{width:20px;height:20px;flex:none}

.choices{display:flex;flex-direction:column;gap:10px}
.choices.two{display:grid;grid-template-columns:1fr 1fr}
.choices.three{display:grid;grid-template-columns:1fr 1fr 1fr}
.choice{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;min-height:58px;cursor:pointer;display:flex;gap:12px;align-items:center;font-size:18.5px;line-height:1.35;width:100%}
.choice .ltr{flex:none;width:30px;height:30px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--muted)}
.choice .mark{margin-left:auto;flex:none;display:none}
.choice .mark svg{width:22px;height:22px}
.choice:hover:not([disabled]){border-color:var(--muted)}
.choices.two .choice,.choices.three .choice{justify-content:center;text-align:center;font-weight:700;font-size:20px;min-height:72px}
.choices.two .choice .mark,.choices.three .choice .mark{margin-left:0}
.choice.right{border-color:var(--good);background:var(--good-bg)}
.choice.wrong{border-color:var(--bad);background:var(--bad-bg)}
.choice.right .mark,.choice.wrong .mark{display:inline-flex}
.choice.right .mark{color:var(--good)} .choice.wrong .mark{color:var(--bad)}
.choice[disabled]{cursor:default}
.choice[disabled]:not(.right):not(.wrong){opacity:.6}

.feedback{border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;scroll-margin-bottom:24px}
.feedback.ok{background:var(--good-bg)}
.feedback.no{background:var(--bad-bg)}
.feedback .h{font-weight:700;font-size:20px;display:flex;gap:8px;align-items:center}
.feedback .h svg{width:22px;height:22px;flex:none}
.feedback.ok .h{color:var(--good)} .feedback.no .h{color:var(--bad)}
.feedback .fx{border-top:1px solid color-mix(in srgb, var(--ink) 12%, transparent);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.feedback .next{color:var(--muted);font-size:15.5px}
.feedback .trap{background:var(--surface)}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field .flabel{font-weight:700;font-size:16px}
.field input,.field textarea,.field select{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 13px;width:100%;font-size:18px;min-height:var(--tap)}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--focus)}
.field textarea{min-height:88px;resize:vertical}
.field .hint{font-size:14.5px;color:var(--muted)}
.typein{font-size:24px !important;letter-spacing:.05em}
.goalnote .banner{display:flex;flex-direction:column;gap:10px}

/* story reader */
.passage{font-size:19px;line-height:1.75;max-width:34em}
.passage p + p{margin-top:1em}
.story-title{font-family:var(--font-display);font-size:22px;letter-spacing:.02em;line-height:1.3}
details.reread{border:1px solid var(--line);border-radius:14px;background:var(--surface)}
details.reread summary{cursor:pointer;padding:12px 16px;font-weight:700;min-height:var(--tap);display:flex;align-items:center}
details.reread .passage{padding:0 16px 16px;font-size:17.5px}
.wordtip{background:var(--surface-2);border-radius:12px;padding:12px 14px}

/* segmented controls */
.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:11px;padding:8px 6px;font-weight:700;cursor:pointer;color:var(--muted);min-height:44px;font-size:16px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 15px;font-size:16px;cursor:pointer;white-space:nowrap;min-height:44px;font-weight:700;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* lists */
.wlist{display:flex;flex-direction:column}
.wrow{display:flex;gap:12px;align-items:center;padding:12px 4px;min-height:60px;border:0;border-bottom:1px solid var(--line);cursor:pointer;background:none;text-align:left;width:100%;color:var(--ink)}
.wrow:last-child{border-bottom:0}
.wrow .w{font-weight:700;min-width:0;flex:1}
.wrow .w span{display:block;font-weight:400;color:var(--muted);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tier{font-size:14px;color:var(--muted);white-space:nowrap;min-width:64px;text-align:right}
.tier.Strong{color:var(--gold-ink);font-weight:700}

/* progress */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font-body)}
.stackbar{display:flex;gap:2px;height:24px;border-radius:8px;overflow:hidden;background:var(--surface-2)}
.stackbar i{display:block;height:100%}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:15.5px}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
.legend b{margin-left:auto;font-variant-numeric:tabular-nums}
table.t{width:100%;border-collapse:collapse;font-size:16px}
table.t td,table.t th{padding:9px 4px;border-bottom:1px solid var(--line);text-align:left}
table.t tr:last-child td{border-bottom:0}
table.t th{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
table.t td.r,table.t th.r{text-align:right;font-variant-numeric:tabular-nums}
.bigstat{font-size:40px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}

/* send */
.codebox{width:100%;min-height:120px;font-family:ui-monospace, Menlo, Consolas, monospace;font-size:13px;border:1.5px solid var(--line);border-radius:12px;padding:12px;background:var(--surface-2);color:var(--ink);word-break:break-all;resize:vertical}
.status{min-height:1.5em;font-size:15.5px}
.status.ok{color:var(--good)} .status.no{color:var(--bad)}
.confirm{border:1.5px solid var(--bad);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}

/* steps on the welcome screen */
.steps{padding-left:22px;display:flex;flex-direction:column;gap:6px}
.steps li::marker{color:var(--muted);font-weight:700}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb, var(--surface) 94%, transparent);border-top:1px solid var(--line);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  padding:6px max(10px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px))}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;padding:4px 2px;border-radius:12px;cursor:pointer;color:var(--muted);font-size:13px;font-weight:700}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"] svg{color:var(--gold-ink)}

/* sheet (in-page dialog) */
.modal{position:fixed;inset:0;z-index:20;background:rgba(5,6,20,.55);display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:var(--bg);width:100%;max-width:600px;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:22px 22px 0 0;overscroll-behavior:contain;
  padding:20px max(20px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px))}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:-6px auto 4px}

.foot{text-align:center;color:var(--muted);font-size:13.5px;margin:28px 0 6px}
.fade-in{animation:fi .22s ease-out}
@keyframes fi{from{opacity:.3;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){
  .fade-in{animation:none}
  .ring .arc{transition:none}
  *{scroll-behavior:auto !important}
}
@media (min-width:700px){
  body{font-size:19px}
  .headword{font-size:44px}
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (max-width:370px){
  body{padding-left:max(14px, env(safe-area-inset-left, 0px));padding-right:max(14px, env(safe-area-inset-right, 0px))}
  .headword{font-size:33px}
  .big{font-size:28px}
  .band{padding:20px 16px 18px}
  .choices.three{grid-template-columns:1fr}
}
@media (forced-colors: active){
  .choice.right,.choice.wrong{border-width:3px}
  .btn{border:1px solid ButtonText}
}

/* Word Quest v2: Jonathan's read-only view. Every rule is scoped under .tv and uses the page's color tokens. */
.tv{color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;min-width:0;max-width:100%;display:flex;flex-direction:column;gap:12px}
.tv *{box-sizing:border-box}
.tv [hidden]{display:none !important}
.tv :focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.tv p{margin:0}
.tv-head{display:flex;flex-direction:column;gap:2px;padding:2px 2px 4px}
.tv .tv-title{font-family:var(--font-display);font-size:21px;letter-spacing:.06em;margin:0;font-weight:700}
.tv .tv-muted{color:var(--muted)}
.tv .tv-small{font-size:13.5px}
.tv .tv-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* sections */
.tv .tv-sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);min-width:0}
.tv .tv-sec > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;min-height:52px;padding:10px 16px;
  font-family:var(--font-display);font-weight:700;font-size:16px;letter-spacing:.05em;border-radius:var(--radius)}
.tv .tv-sec > summary::-webkit-details-marker{display:none}
.tv .tv-sec > summary::before{content:"";flex:none;width:9px;height:9px;border-right:2px solid var(--gold-ink);border-bottom:2px solid var(--gold-ink);transform:rotate(-45deg);transition:transform .15s}
.tv .tv-sec[open] > summary::before{transform:rotate(45deg)}
.tv .tv-sec[open] > summary{border-bottom:1px solid var(--line);border-radius:var(--radius) var(--radius) 0 0}
.tv .tv-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.tv .tv-h3{font-family:var(--font-body);font-size:15px;font-weight:700;margin:6px 0 0;color:var(--ink)}
.tv .tv-empty{color:var(--muted);font-style:italic}
@media (prefers-reduced-motion: reduce){ .tv .tv-sec > summary::before{transition:none} }

/* overview */
.tv .tv-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:720px){ .tv .tv-grid{grid-template-columns:repeat(3,minmax(0,1fr))} }
.tv .tv-stat{background:var(--surface-2);border-radius:12px;padding:10px 12px;min-width:0}
.tv .tv-k{font-size:13px;color:var(--muted)}
.tv .tv-v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tv .tv-s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.tv .tv-strength{display:flex;flex-direction:column;gap:6px}
.tv .tv-bar{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.tv .tv-bar span{display:block;min-width:2px}
.tv .tv-b-new{background:var(--line)}
.tv .tv-b-learning{background:var(--focus)}
.tv .tv-b-growing{background:var(--gold)}
.tv .tv-b-strong{background:var(--good)}
.tv .tv-b-rest{background:transparent}
.tv .tv-legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;font-variant-numeric:tabular-nums}
.tv .tv-legend span{display:inline-flex;align-items:center;gap:6px}
.tv .tv-dot{display:inline-block;width:10px;height:10px;border-radius:3px}
.tv .tv-dl{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:4px 14px;margin:0;font-size:14.5px}
.tv .tv-dl dt{color:var(--muted)}
.tv .tv-dl dd{margin:0;overflow-wrap:anywhere}
@media (max-width:420px){ .tv .tv-dl{grid-template-columns:minmax(0,1fr)} .tv .tv-dl dd{margin-bottom:6px} }

/* tables: wide ones scroll inside their own box, never the page */
.tv .tv-scroll{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.tv .tv-table{border-collapse:collapse;width:100%;font-size:14.5px;font-variant-numeric:tabular-nums}
.tv .tv-table th,.tv .tv-table td{padding:7px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.tv .tv-table th{background:var(--surface-2);font-weight:700;font-size:13px;color:var(--muted);white-space:nowrap;position:sticky;top:0}
.tv .tv-table tbody tr:last-child > td{border-bottom:0}
.tv .tv-table .n{text-align:right;white-space:nowrap}
.tv .tv-table td{white-space:nowrap}
.tv .tv-table td.w{white-space:normal;overflow-wrap:break-word;min-width:8em}
@media (max-width:420px){ .tv .tv-table th,.tv .tv-table td{padding:7px 7px} }
.tv .tv-words{min-width:600px}
.tv .tv-words td{white-space:nowrap}
.tv .tv-words tr.tv-ns td{color:var(--muted)}
.tv .tv-marks{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;letter-spacing:0;color:var(--muted)}
.tv .tv-wbtn{font:inherit;font-weight:700;color:var(--ink);background:none;border:0;padding:6px 4px;margin:-6px -4px;min-height:36px;cursor:pointer;text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:3px}
.tv tr.tv-ns .tv-wbtn{font-weight:400;color:var(--muted)}
.tv .tv-wbtn[aria-expanded="true"]{color:var(--gold-ink)}
.tv tr.tv-detail > td{background:var(--surface-2);white-space:normal;padding:0}
.tv .tv-wd{position:sticky;left:0;padding:12px;display:flex;flex-direction:column;gap:8px;white-space:normal}
.tv .tv-wd-w{font-family:var(--font-display);font-size:18px;letter-spacing:.04em}
.tv .tv-explain{background:var(--warn-bg);color:var(--warn-ink);border-radius:8px;padding:6px 10px}
.tv .tv-hist{font-size:13.5px}
@media (max-width:420px){ .tv .tv-hist th,.tv .tv-hist td{padding:6px 5px;font-size:13px} .tv .tv-wd{padding:10px 8px} }
.tv .tv-hist td.w{min-width:6em}
.tv .tv-ok{color:var(--good);font-weight:700}
.tv .tv-no{color:var(--bad);font-weight:700}

/* sentences */
.tv .tv-cards{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.tv .tv-cards li{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.tv .tv-line{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px}
.tv .tv-her{overflow-wrap:anywhere;white-space:pre-wrap}

/* form */
.tv .tv-form{display:flex;flex-direction:column;gap:12px}
.tv .tv-field{display:flex;flex-direction:column;gap:4px;min-width:0}
.tv .tv-lbl{font-weight:700;font-size:15px}
.tv .tv-help{font-size:13.5px;color:var(--muted)}
.tv .tv-input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px;width:100%;max-width:100%}
.tv select.tv-input{appearance:auto}
.tv textarea.tv-input{resize:vertical;min-height:80px}
.tv .tv-code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;word-break:break-all}
.tv .tv-check{display:flex;align-items:center;gap:8px;min-height:40px;font-size:15px}
.tv .tv-check input{width:20px;height:20px;accent-color:var(--gold-ink)}
.tv .tv-adds{display:flex;flex-direction:column;gap:10px}
.tv .tv-add{border:1px solid var(--line);border-radius:10px;padding:10px 12px 12px;margin:0;display:flex;flex-direction:column;gap:10px;min-width:0}
.tv .tv-add legend{font-size:13px;color:var(--muted);padding:0 4px}
.tv .tv-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:400px){ .tv .tv-two{grid-template-columns:minmax(0,1fr)} }
.tv .tv-btn{font:inherit;font-weight:700;min-height:48px;padding:10px 18px;border-radius:12px;cursor:pointer;border:1px solid var(--line);background:var(--surface-2);color:var(--ink)}
.tv .tv-btn-main{background:var(--gold);border-color:var(--gold);color:var(--on-gold, #1A1E3C);align-self:flex-start;min-width:160px}
.tv .tv-btn-quiet{align-self:flex-start;min-height:44px;font-weight:400}
.tv .tv-err{color:var(--bad);font-weight:700}
.tv .tv-err:empty{display:none}
.tv .tv-out{display:flex;flex-direction:column;gap:10px;background:var(--good-bg);border-radius:12px;padding:12px}
.tv .tv-out .tv-input{background:var(--surface)}
.tv .tv-does{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;overflow-wrap:anywhere}

</style>

parts.","choices":["condescending","respectful","tardy","industrious"],"answer":"condescending"}],"abundant":[{"sentence":"Because Demeter was happy while Persephone was with her, crops were ____ all spring and summer.","choices":["abundant","scarce","futile","silent"],"answer":"abundant"},{"sentence":"Acorns were so ____ under the old oak tree that the squirrels had more than they could bury before winter.","choices":["abundant","scarce","candid","dreary"],"answer":"abundant"}],"elated":[{"sentence":"Although the trip had been canceled twice, the class was ____ when the bus finally arrived to take them to the aquarium.","choices":["elated","disappointed","insular","elaborate"],"answer":"elated"},{"sentence":"The villagers were ____ when the brave knight returned with the stolen bell, and they danced in the square until midnight.","choices":["elated","miserable","subordinate","astute"],"answer":"elated"}],"appreciative":[{"sentence":"Because the firefighters had rescued their cat from the tall tree, the ____ family visited the fire station to thank each one of them in person.","choices":["appreciative","jealous","arduous","sufficient"],"answer":"appreciative"},{"sentence":"Ms. Diaz was so ____ of our handmade card that she pinned it to her desk and kept it there all year.","choices":["appreciative","jealous","scornful","skeptical"],"answer":"appreciative"}]}</script>

"},"flourish":{"like":"flour","feel":"0","note":"Flourish looks like flour, but it is not about baking. It means to grow strong or do very well. The feeling is good."},"precarious":{"like":"precious","feel":"+","note":"Precarious looks like precious, but it means not safe or steady, likely to fall. The feeling is bad."},"fabricate":{"like":"fabric","feel":"0","note":"Fabricate looks like fabric, but it is not about cloth. It means to make up something false to trick people. The feeling is bad."},"malicious":{"like":"delicious","feel":"+","note":"Malicious sounds like delicious, but it means wanting to hurt or upset others on purpose. The feeling is bad."},"bewilder":{"like":"wild","feel":"0","note":"Bewilder looks like wild, but it is not about nature or animals. It means to confuse someone completely. The feeling is bad."},"vibrant":{"like":"violent","feel":"-","note":"Vibrant looks like violent, but it means full of life and energy. The feeling is good."},"conspicuous":{"like":"suspicious","feel":"-","note":"Conspicuous sounds like suspicious, but it is not about thinking someone did something wrong. It means easy to see or notice."},"meticulous":{"like":"ridiculous","feel":"-","note":"Meticulous sounds like ridiculous, but it means very careful about every small detail. The feeling is good."},"idle":{"like":"idol","feel":"0","note":"Idle sounds like idol, a famous star, but it means not working or being used, doing nothing."},"superficial":{"like":"super","feel":"+","note":"Superficial looks like super, but it means only on the surface, not deep or careful. The feeling is bad."},"haughty":{"like":"naughty","feel":"0","note":"Haughty sounds like naughty, but it means acting as if you are better than other people. The feeling is bad."}}</script>
<script type="application/json" id="passages">[{"id":"p1","title":"A Visit to the Land of the Dead","words":["bleak","hallowed","din","apparition","modest","futile","vigorous"],"forms":{"bleak":"bleak","hallowed":"hallowed","din":"din","apparition":"apparition","modest":"modest","futile":"futile","vigorous":"vigorous"},"text":"Odysseus had been trying to sail home for years. The goddess Circe told him that first he must visit the land of the dead and speak with Tiresias, a wise prophet who could see the future. So the brave king sailed to the far edge of the world. It was a bleak place, dark and foggy, where the sun never shone.\n\nThere Odysseus dug a pit in the ground and poured in hallowed gifts for the spirits. They were modest gifts, nothing fancy or expensive: honey, milk, wine and water. Soon the dead came crowding around him, making a din of cries and moans that would not stop. Odysseus held up his sword and stood firm.\n\nThen he saw an apparition that broke his heart. It was the ghost of his mother. She had been alive when he left for the war at Troy. Now she told him that she had died of sadness while she waited for him to come home.\n\nOdysseus reached out three times to hug her. Each time, his arms closed on empty air. His effort was futile, because no one can hold a ghost. The vigorous hero, who could row a ship all day without resting, stood there and cried. He had the courage to face the dead and a heart big enough to love them.","questions":[{"type":"main","stem":"The passage is mainly about","choices":["a hero's brave and sad visit to the land of the dead","the honey, milk, wine and water that Odysseus pours into a pit","the many dangers that Greek heroes faced on their long journeys","how Odysseus finds a way to bring his mother back to life"],"answer":"a hero's brave and sad visit to the land of the dead","why":"Every paragraph follows Odysseus in the land of the dead, building up to the meeting with his mother."},{"type":"tone","stem":"The author's attitude toward Odysseus is best described as","choices":["admiring","amused","critical","uncertain"],"answer":"admiring","why":"The author calls him \"brave,\" says he \"stood firm,\" and praises his \"courage\" and his big heart."},{"type":"vocab","stem":"In the passage, the word \"futile\" most nearly means","choices":["useless","good for growing plants","very careful","full of joy"],"answer":"useless","why":"His arms \"closed on empty air\" each time, so his effort to hug her could not succeed."}]},{"id":"p2","title":"The Old Rain Spell","words":["insular","obsolete","dreary","meager","subordinate","spontaneous","candid"],"forms":{"insular":"insular","obsolete":"obsolete","dreary":"dreary","meager":"meager","subordinate":"subordinate","spontaneous":"spontaneous","candid":"candid"},"text":"The village of Fernhollow sat high in the mountains, far from any road. Its people were insular. They did not trust strangers, and they laughed at every new idea. For three hundred years they had done everything the same way, and they were proud of it.\n\nEvery spring, the village wizard read a rain spell from a huge old book. But the spell was obsolete. It had been written for a river that had dried up long ago, and it no longer worked. Year after year the sky stayed gray and dreary, yet no rain fell. The fields gave only a meager harvest, and many families went to bed hungry.\n\nThe wizard's young helper, Mira, had a subordinate role. She swept the floors and carried the books, and no one ever asked what she thought. One morning, while she watched the clouds, she had a spontaneous idea and said it out loud before she could stop herself. \"What if we write a new spell for the clouds instead of the river?\"\n\nThe villagers frowned. Their old ways were good enough, they said. But the wizard was candid. \"My spell does not work,\" he told them plainly. \"Let the girl try.\" That night, rain poured down on the thirsty fields. Even so, the stubborn villagers complained about the change for weeks.","questions":[{"type":"main","stem":"The passage is mainly about","choices":["a new idea that fixes what a village's old ways could not","a rain spell that was written for a river that dried up","the many ways that magic can help people","a helper who wants to become the most powerful wizard in the mountains"],"answer":"a new idea that fixes what a village's old ways could not","why":"The passage shows the old spell failing, Mira's new idea, and the rain that follows."},{"type":"tone","stem":"The author's attitude toward the villagers is best described as","choices":["critical","admiring","fearful","jealous"],"answer":"critical","why":"The author shows them laughing \"at every new idea\" and calls them \"stubborn\" for complaining even after the rain came."},{"type":"vocab","stem":"In the passage, the word \"obsolete\" most nearly means","choices":["out of date","complete or total","very powerful","hidden away"],"answer":"out of date","why":"The spell was written for a river that \"dried up long ago,\" so it \"no longer worked.\""}]},{"id":"p3","title":"The Weaver Who Would Not Bow","words":["industrious","attribute","contempt","impulsive","reverence","ample","elaborate"],"forms":{"industrious":"industrious","attribute":"attribute","contempt":"contempt","impulsive":"impulsive","reverence":"reverence","ample":"ample","elaborate":"elaborate"},"text":"Long ago, in the land of Lydia, there lived a young woman named Arachne. She was the most industrious weaver in the land. She worked from sunrise to sunset, and her cloth was so fine that people traveled for days just to watch her. Her greatest attribute was her skill, but her pride was even greater.\n\nPeople said that the goddess Athena must have taught her. Arachne spoke of the goddess with contempt. \"No one taught me,\" she said. \"I am better than Athena herself.\" It was an impulsive boast, made without a moment of thought, and it was a foolish one. The Greeks believed that the gods deserved deep reverence.\n\nAthena gave Arachne ample warning. First the goddess came dressed as an old woman and kindly told her to ask for forgiveness. Arachne only told her to go away. Then Athena showed her true self, and the two began to weave side by side.\n\nAthena wove a picture of the gods in all their glory. Arachne wove an elaborate picture full of tiny details, showing the gods behaving badly. Her work had no mistakes, yet it insulted the gods. Athena tore the cloth apart and turned Arachne into a spider. To this day, spiders spend their lives weaving, but they never get to boast.","questions":[{"type":"main","stem":"The passage is mainly about","choices":["how Arachne's pride leads her to insult Athena and be punished","how Athena first visited Arachne dressed as an old woman","how the Greek gods treated people on Earth","how Arachne and Athena became friends after weaving together"],"answer":"how Arachne's pride leads her to insult Athena and be punished","why":"The passage moves from Arachne's pride to her boast, her refusal to apologize, and her punishment."},{"type":"tone","stem":"The author's attitude toward Arachne's pride is best described as","choices":["disapproving","admiring","fearful","jealous"],"answer":"disapproving","why":"The author calls Arachne's boast \"foolish\" and shows that her pride ends in punishment."},{"type":"vocab","stem":"In the passage, the word \"reverence\" most nearly means","choices":["deep respect","a mention of something","quiet anger","a long journey"],"answer":"deep respect","why":"Arachne's boast was foolish because the Greeks believed the gods should be honored, not insulted."}]},{"id":"p4","title":"The Tardy Knight","words":["tardy","recruit","clandestine","burgeoning","skeptical","adversary","astute"],"forms":{"tardy":"tardy","recruit":"recruit","clandestine":"clandestine","burgeoning":"burgeoning","skeptical":"skeptical","adversary":"adversary","astute":"astute"},"text":"Sir Pell was a kind knight, but he was always tardy. He came late to breakfast, late to training and once, very late, to his own birthday party. The other knights joked that he would be late to the end of the world.\n\nOne spring, the queen needed to recruit five knights for a mission. On a clandestine trip at midnight, when no one could see her, a witch had planted a magic forest near the northern border. It grew a mile every night. Soon it would cover the farms and their burgeoning crops, which grew taller every day.\n\nThe four bravest knights arrived at dawn. Sir Pell arrived at noon, out of breath, with his helmet on backward. The queen looked skeptical. She did not believe he would be much help. Still, she needed a fifth knight, so she let him come.\n\nAt the edge of the forest, the knights met their adversary, a giant made of twisted branches. The others attacked with their swords, and the giant only laughed. Sir Pell was far behind, as usual, so he had time to look around. He was astute, and he noticed what the others had missed. The giant got its strength from sunlight. The knights quickly hung their tents above it to block the sun, and the giant shrank to a little stick. For once, being late had helped.","questions":[{"type":"main","stem":"The passage is mainly about","choices":["a late knight who beats a giant by noticing what others missed","a knight who once came late to his own birthday party","why knights must be brave to protect their kingdom","a knight who finally learns to arrive on time"],"answer":"a late knight who beats a giant by noticing what others missed","why":"The passage starts with Pell's lateness and ends with that lateness helping him beat the giant."},{"type":"tone","stem":"The author's attitude toward Sir Pell is best described as","choices":["amused","angry","worried","jealous"],"answer":"amused","why":"Funny details like his \"helmet on backward\" and being late to his own party show the author finds him amusing."},{"type":"vocab","stem":"In the passage, the word \"clandestine\" most nearly means","choices":["secret","certain to happen","well paid","very short"],"answer":"secret","why":"The witch went at midnight, \"when no one could see her,\" so her trip was secret."}]},{"id":"p5","title":"The Guests in the Little Cottage","words":["arduous","aloof","amiable","abundant","authentic","appreciative","elated"],"forms":{"arduous":"arduous","aloof":"aloof","amiable":"amiable","abundant":"abundant","authentic":"authentic","appreciative":"appreciative","elated":"elated"},"text":"Zeus and Hermes once came down from Mount Olympus dressed as poor travelers. They wanted to see how people treated strangers. After an arduous walk over steep, rocky hills, they reached a town and knocked on a thousand doors. Every family was aloof. They looked at the tired strangers coldly and shut their doors.\n\nAt last the gods came to a tiny cottage with a roof of straw. There lived an old couple, Baucis and Philemon. They were poor, but they were amiable, and they smiled as they welcomed the strangers inside. Baucis cooked a simple meal of cabbage, olives and eggs, and Philemon poured their only wine.\n\nAs the meal went on, the old couple noticed something strange. No matter how much wine they poured, the bowl stayed full. The wine was abundant, even though the bowl was small. They realized that their guests were not authentic travelers at all. They were gods.\n\nZeus was appreciative of their kindness. He punished the unkind neighbors with a flood, but he turned the little cottage into a shining temple. When he asked what the couple wanted, they asked to care for the temple and to leave this life at the same moment, so neither would be left alone. They were elated when he agreed. Many years later, they became two trees growing side by side.","questions":[{"type":"main","stem":"The passage is mainly about","choices":["a kind old couple who welcome two gods and are rewarded","a bowl of wine that keeps filling itself during a meal","the many times that Greek gods visited Earth","two gods who are looking for a place to build a new temple"],"answer":"a kind old couple who welcome two gods and are rewarded","why":"The passage contrasts the cold town with the kind couple and ends with the gods rewarding them."},{"type":"tone","stem":"The author's attitude toward Baucis and Philemon is best described as","choices":["admiring","scornful","amused","worried"],"answer":"admiring","why":"The author shows them smiling, sharing their only wine, and being rewarded, while the cold neighbors are punished."},{"type":"vocab","stem":"In the passage, the word \"abundant\" most nearly means","choices":["plentiful","left behind","bitter","hidden"],"answer":"plentiful","why":"\"No matter how much wine they poured, the bowl stayed full,\" so there was always more than enough."}]},{"id":"p6","title":"The Dragon on the Hill","words":["belligerent","acrid","nostalgic","prosperity","audacious","banish","compensate"],"forms":{"belligerent":"belligerent","acrid":"acrid","nostalgic":"nostalgic","prosperity":"prosperity","audacious":"audacious","banish":"banish","compensate":"compensated"},"text":"For ten years, a belligerent dragon lived on the hill above the town of Millbrook. He picked fights with anyone who came near and even roared at birds for flying past his cave. Each night he breathed fire over the fields, and the acrid smoke made everyone's eyes sting and their throats burn.\n\nThe oldest people in town felt nostalgic when they remembered the happy festivals of the past. Back then, the markets had been full and the farms had been green. But with the dragon so close, the farmers could not grow wheat and the traders stayed away. The town's prosperity faded, and the people grew poor.\n\nThen a young knight named Wren made an audacious plan. She would not fight the dragon. Instead, she would climb the hill alone, without a sword, and talk to him. Everyone said she was foolish, but she went anyway.\n\nWren learned that the dragon was angry because a wizard's spell had trapped him on the hill, far from his family. She broke the spell, and the dragon flew home happily. The town council voted to banish the wizard from the land forever, and the queen compensated the farmers for their burned crops. Already, new wheat is sprouting, and traders are coming back. Millbrook's best days seem to be just ahead.","questions":[{"type":"main","stem":"The passage is mainly about","choices":["how a knight frees a town from a dragon by talking, not fighting","how the dragon's smoke made people's eyes sting","how dragons have caused trouble for people in many lands","how Wren becomes the new ruler of Millbrook"],"answer":"how a knight frees a town from a dragon by talking, not fighting","why":"The passage describes the town's trouble, Wren's plan to talk instead of fight, and the town's recovery."},{"type":"tone","stem":"The author's attitude toward the future of Millbrook is best described as","choices":["hopeful","doubtful","bored","angry"],"answer":"hopeful","why":"The passage ends with new wheat \"sprouting\" and says the town's \"best days seem to be just ahead.\""},{"type":"vocab","stem":"In the passage, the word \"belligerent\" most nearly means","choices":["eager to fight","smart and quick to learn","very old","very sleepy"],"answer":"eager to fight","why":"The dragon \"picked fights with anyone who came near\" and even roared at birds."}]}]</script>
<script type="application/json" id="parts">[{"id":"ous","part":"-ous","kind":"suffix","meaning":"full of or having","bank":["vigorous","industrious","arduous","audacious","zealous","ferocious","mischievous","monotonous","cautious","malicious","unanimous","pompous","perilous","ominous"],"lesson":"The ending -ous often means full of. Vigorous is full of vigor, or energy.","caution":"The ending can also mean having. Monotonous means having one tone, so it is dull, not full of tones.","checks":[{"word":"hazardous","hint":"hazard (danger) + -ous (full of)","stem":"HAZARDOUS most likely means","choices":["dangerous","hazy","peaceful","famous"],"answer":"dangerous"},{"word":"mountainous","hint":"mountain + -ous (full of)","stem":"MOUNTAINOUS most likely means","choices":["full of mountains","flat and low","covered in sand","close to the sea"],"answer":"full of mountains"},{"word":"humorous","hint":"humor (being funny) + -ous (full of)","stem":"HUMOROUS most likely means","choices":["funny","humid","serious","shy"],"answer":"funny"}]},{"id":"in-not","part":"in-/im-","kind":"prefix","meaning":"not","bank":["indifferent","incessant","immense","inevitable","indignant","intrepid","impartial","inept"],"lesson":"The prefix in- or im- often means not. Impartial means not taking one side, so it is fair.","caution":"In- can also mean in or into, as in insert and inhale. And invaluable means very valuable, not worthless.","checks":[{"word":"immortal","hint":"im- (not) + mortal (sure to die someday)","stem":"IMMORTAL most likely means","choices":["undying","important","tiny","noisy"],"answer":"undying"},{"word":"inaudible","hint":"in- (not) + audible (able to be heard)","stem":"INAUDIBLE most likely means","choices":["impossible to hear","very loud","hard to see","allowed inside"],"answer":"impossible to hear"},{"word":"immobile","hint":"im- (not) + mobile (able to move)","stem":"IMMOBILE most likely means","choices":["unable to move","able to fly","full of energy","newly made"],"answer":"unable to move"}]},{"id":"re","part":"re-","kind":"prefix","meaning":"back or again","bank":["reimburse","replenish","resilient"],"lesson":"The prefix re- often means back or again. Replenish means to fill something up again.","caution":"In reluctant, re- means against, not again. Some words, like ready, just begin with the letters re.","checks":[{"word":"reclaim","hint":"re- (back) + claim (to say something is yours)","stem":"RECLAIM most likely means","choices":["take back","climb up","give away","sleep late"],"answer":"take back"},{"word":"reunite","hint":"re- (again) + unite (to join together)","stem":"REUNITE most likely means","choices":["join again","untie","split apart","forget"],"answer":"join again"},{"word":"reconsider","hint":"re- (again) + consider (to think about)","stem":"RECONSIDER most likely means","choices":["think about again","refuse to listen","decorate","record"],"answer":"think about again"}]},{"id":"able","part":"-able/-ible","kind":"suffix","meaning":"able to or able to be","bank":["amiable","credible","plausible","inevitable","vulnerable","formidable","durable","gullible"],"lesson":"The ending -able or -ible often means able to be. Credible means able to be believed.","caution":"Table and cable just end in the letters able. They do not have this ending.","checks":[{"word":"habitable","hint":"habit (to live in, as in inhabit) + -able (able to be)","stem":"HABITABLE most likely means","choices":["fit to live in","done every day","easy to break","very old"],"answer":"fit to live in"},{"word":"legible","hint":"leg (to read) + -ible (able to be)","stem":"LEGIBLE most likely means","choices":["easy to read","able to walk","easy to lift","hard to believe"],"answer":"easy to read"},{"word":"portable","hint":"port (to carry) + -able (able to be)","stem":"PORTABLE most likely means","choices":["easy to carry","near the sea","good to drink","hard to open"],"answer":"easy to carry"}]},{"id":"ify","part":"-ify","kind":"suffix","meaning":"to make","bank":["pacify","verify"],"lesson":"The ending -ify often means to make. Pacify means to make someone calm and peaceful.","caution":"The base is not always a word you know. In verify, ver means true, so verify means to show that something is true.","checks":[{"word":"solidify","hint":"solid (hard, not liquid) + -ify (to make)","stem":"SOLIDIFY most likely means","choices":["become hard","melt","solve","sell"],"answer":"become hard"},{"word":"falsify","hint":"false (not true) + -ify (to make)","stem":"FALSIFY most likely means","choices":["change to trick people","fall down","tell the truth","fold"],"answer":"change to trick people"},{"word":"humidify","hint":"humid (damp, wet air) + -ify (to make)","stem":"HUMIDIFY most likely means","choices":["make the air damp","make people laugh","dry out","make humble"],"answer":"make the air damp"}]},{"id":"mal","part":"mal","kind":"root","meaning":"bad or badly","bank":["dismal","malicious"],"lesson":"The part mal often means bad. Malicious means full of bad wishes, wanting to hurt others.","caution":"Mall and mallet just start with the letters mal. They have nothing to do with bad.","checks":[{"word":"malfunction","hint":"mal- (badly) + function (to work)","stem":"MALFUNCTION most likely means","choices":["fail to work right","go shopping","work perfectly","celebrate"],"answer":"fail to work right"},{"word":"malnourished","hint":"mal- (badly) + nourished (fed)","stem":"MALNOURISHED most likely means","choices":["poorly fed","well fed","very tall","in a mall"],"answer":"poorly fed"},{"word":"malodorous","hint":"mal- (bad) + odor (smell) + -ous (full of)","stem":"MALODOROUS most likely means","choices":["bad-smelling","sweet-smelling","very old","colorful"],"answer":"bad-smelling"}]},{"id":"path","part":"path","kind":"root","meaning":"feeling","bank":["apathy","sympathetic"],"lesson":"The root path means feeling. Apathy means without feeling, so you do not care at all.","caution":"In pathology, path means disease. And a garde   if(out.moved && out.moved.grew) live.grew = (live.grew || 0) + 1;
  persist();
  return out;
}
function movedLine(iv){ return iv == null ? null : (iv <= 1 ? 'Next review tomorrow.' : 'Next review in ' + iv + ' days.'); }

function viewSession(main){
  const k = K();
  if(!live){ show('home'); return; }
  if(live.mode !== 'tricky' && live.day !== k){ if(state.session === live) state.session = null; live = null; save(); show('home'); return; }
  if(live.ap === live.pos){ live.pos++; persist(); }           // answered before a pause or reload: never ask it twice
  if(live.pos >= live.q.length){ finish(main); return; }
  const rec = C.dayRec(state, k);
  const bar = h('div', {class:'sbar'},
    btn('ghost', 'Pause', () => show('home'), {id:'btnPause', 'aria-label':'Pause and go back to Tonight'}),
    h('div', {class:'prog', role:'progressbar', 'aria-label':'Tonight', 'aria-valuemin':'0', 'aria-valuemax': String(live.q.length), 'aria-valuenow': String(live.pos)},
      h('i', {style:'width:' + Math.round(100 * live.pos / Math.max(1, live.q.length)) + '%'})),
    h('span', {class:'timer', id:'sesTimer', 'aria-label':'Time tonight'}, mmss(rec.sec)));
  main.append(bar);
  main.append(h('div', {class:'goalnote', id:'goalNote', 'aria-live':'polite'}));
  const area = h('div', {class:'stack fade-in', id:'qArea'});
  main.append(area);
  const item = live.q[live.pos];
  cur = {item, answer:null};
  try{
    if(item.t === 'new') renderNew(area, item);
    else if(item.t === 'my') renderMy(area, item);
    else if(item.t === 'story') renderStory(area, item);
    else if(item.t === 'part') renderPart(area, item);
    else renderQ(area, item);
  }catch(e){
    // a broken item (content changed under it) must not stop the night
    if(window.console) console.warn('Word Quest: skipped an item', e);
    live.ap = live.pos; nextItem(); return;
  }
  goalCheck();
}
function skipItem(){ live.ap = live.pos; nextItem(); }

/* goal reached: shown once, calmly, above the question */
function goalCheck(){
  if(!live || live.mode === 'tricky' || live.goalShown || viewing) return;
  const el = $('#goalNote'); if(!el) return;
  const rec = C.dayRec(state, K());
  if(rec.sec < state.settings.goal * 60) return;
  const rest = live.q.slice(live.pos + 1).some(it => (it.t === 'q' && !it.chk && !it.retry) || it.t === 'my' || it.t === 'story' || it.t === 'part');
  if(!rest) return;
  live.goalShown = true; persist();
  el.innerHTML = '';
  el.append(h('div', {class:'banner good', id:'goalBanner'},
    h('p', null, h('b', null, state.settings.goal + ' minutes done. '), 'You can finish now or keep going.'),
    h('div', {class:'btnrow'},
      btn('gold', 'Finish now', () => {
        const n = C.trimSession(live); persist();
        el.innerHTML = '';
        el.append(h('div', {class:'banner good'}, n ? 'Tonight ends after ' + plural(n, 'more check') + '.' : 'Tonight ends after this one.'));
        const p = $('.sbar .prog i'); if(p) p.style.width = Math.round(100 * live.pos / Math.max(1, live.q.length)) + '%';
      }, {id:'btnFinishNow'}),
      btn('line', 'Keep going', () => { el.innerHTML = ''; }, {id:'btnKeepGoing'}))));
}

function kindLabel(item){
  const who = item.retry ? 'Again' : item.prac ? 'Practice' : item.chk ? 'Check' : 'Review';
  const name = {meaning:'Meaning', feel:'Feeling', alike:'Look-alikes', syn:'Synonym', rev:'Synonym', sc:'Sentence', ctx:'Sentence', pred:'Predict first', type:'Type the word'}[item.k] || '';
  return who + (name ? ' · ' + name : '');
}
function exampleHTML(e){
  const be = C.blankExample(e), t = e.example;
  if(!be) return esc(t);
  return esc(t.slice(0, be.at)) + '<b>' + esc(t.slice(be.at, be.at + be.len)) + '</b>' + esc(t.slice(be.at + be.len));
}
function blankHTML(sentence){ return esc(sentence).replace('____', '<span class="blank" aria-label="blank"></span>'); }
function filledHTML(sentence, word){ return esc(sentence).replace('____', '<b>' + esc(word) + '</b>'); }

/* ---------- the word card (new word and word sheet) ---------- */
function wordCard(e, opts){
  opts = opts || {};
  const st = opts.st || state;
  const c = st.words[e.word];
  const card = h('div', {class:'card stack'});
  card.append(h('div', {class:'row nowrap', style:'align-items:flex-start'},
    h('div', {class:'grow'}, h('div', {class:'headword'}, e.word), h('div', {class:'say'}, e.say + ' · ' + e.pos)),
    speakBtn(e.word)));
  card.append(h('div', null, h('div', {class:'lbl'}, 'Meaning'), h('div', {class:'meaning'}, e.meaning)));
  const sg = signOf(e.sign);
  card.append(h('div', {class:'row'}, signChip(e.sign), h('span', {class:'muted small'}, sg.reason)));
  const trap = C.TRAPS[e.word];
  if(trap && trap.note){
    const gf = c && c.gf;
    card.append(h('div', {class:'trap'}, h('b', null, 'Sound trap: '), trap.note,
      gf && gf !== e.sign ? h('div', {style:'margin-top:6px'}, 'You said ' + signOf(gf).short + '. It is ' + sg.short + '.') : null));
  }
  card.append(h('div', null, h('div', {class:'lbl'}, 'Example'),
    h('div', {class:'row nowrap', style:'align-items:flex-start'}, h('div', {class:'example grow', html: exampleHTML(e)}), speakBtn(e.example, 'Hear the example'))));
  if(e.same && e.same.length) card.append(h('div', null, h('div', {class:'lbl'}, 'Same as'), h('div', {class:'syns'}, e.same.map(x => h('span', null, x)))));
  if(e.not) card.append(h('div', {class:'contrast'}, h('b', null, 'Not ' + e.not.word + ': '), e.not.meaning));
  if(e.parts) card.append(h('div', null, h('div', {class:'lbl'}, 'Word parts'), h('div', null, e.parts)));
  if(e.forms) card.append(h('div', null, h('div', {class:'lbl'}, 'Other forms'), h('div', null, e.forms)));
  if(state.settings.zh !== 'off' && e.zh){
    const z = h('div', {class:'zh', hidden:true, lang:'zh'}, e.zh);
    const b = h('button', {type:'button', class:'btn line', 'aria-expanded':'false', onclick: () => { z.hidden = !z.hidden; b.textContent = z.hidden ? 'Show Chinese' : 'Hide Chinese'; b.setAttribute('aria-expanded', String(!z.hidden)); }}, 'Show Chinese');
    card.append(h('div', {class:'row'}, b, z));
  }
  if(opts.aloud) card.append(h('div', {class:'aloud', html: ICON.lips + '<span>Say it aloud once.</span>'}));
  return card;
}

/* ---------- new word ---------- */
function renderNew(area, item){
  const e = C.BY.get(item.w);
  if(!e){ skipItem(); return; }
  const k = K();
  const idx = live.newWords.indexOf(item.w) + 1;
  const label = 'New word' + (idx ? ' ' + idx + ' of ' + live.newWords.length : '');
  const trap = C.TRAPS[item.w];
  const c = state.words[item.w];
  item.sub = item.sub || {};
  cur.answer = null; cur.phase = 'card';
  if(trap && !item.sub.g && !(c && c.gf)){
    // guess first: only the word, its sound, and her feeling about it
    cur.phase = 'guess';
    area.append(h('div', {class:'kind'}, label));
    area.append(h('div', {class:'card stack'},
      h('div', {class:'row nowrap', style:'align-items:flex-start'},
        h('div', {class:'grow'}, h('div', {class:'headword'}, e.word), h('div', {class:'say'}, e.say)), speakBtn(e.word)),
      h('p', {class:'prompt'}, 'How does this word feel to you?')));
    const pickG = v => {
      item.sub.g = v;
      C.introduce(state, item.w, k);
      state.words[item.w].gf = v;
      persist(); show('session');
    };
    area.append(h('div', {class:'choices three', role:'group', 'aria-label':'How it feels'},
      [['+', '+ good', 'Good'], ['-', '− bad', 'Bad'], ['0', 'neutral', 'Neutral']].map(([v, t, al]) =>
        h('button', {type:'button', class:'choice', 'data-v': v, id:'guess' + ({'+':'Pos', '-':'Neg', '0':'Neu'}[v]), 'aria-label': al, onclick: () => pickG(v)}, h('span', null, t)))));
    return;
  }
  if(!state.words[item.w]){ C.introduce(state, item.w, k); persist(); }
  area.append(h('div', {class:'kind'}, label));
  area.append(wordCard(e, {aloud:true}));
  area.append(btn('gold block big', 'Got it', () => { live.ap = live.pos; nextItem(); }, {id:'btnGotIt'}));
}

/* ---------- questions with choices ---------- */
function prep(item, e){
  const word = e.word;
  const top = (extra) => h('div', {class:'stack tight'}, h('div', {class:'row nowrap'}, h('div', {class:'big grow'}, word.toUpperCase()), speakBtn(word)), extra || null);
  switch(item.k){
    case 'meaning': return {top: h('div', {class:'stack tight'}, h('p', {class:'prompt'}, 'What does it mean?'), top()),
      choices: C.meaningChoices(e).map(m => ({v:m, label:m})), answer: e.meaning};
    case 'feel': {
      const ch = [{v:'+', label:'+ positive'}, {v:'-', label:'− negative'}];
      if(e.sign === '0') ch.push({v:'0', label:'neutral'});
      return {top: h('div', {class:'stack tight'}, h('p', {class:'prompt'}, 'How does it feel?'), top(h('p', {class:'muted small'}, 'Think of the meaning, not the sound.'))),
        choices: ch, answer: e.sign, layout: ch.length === 3 ? 'three' : 'two'};
    }
    case 'alike': {
      if(!e.not) return prep(Object.assign({}, item, {k:'meaning'}), e);
      const own = C.rng() < 0.5;
      const m = own ? e.meaning : e.not.meaning;
      return {top: h('div', {class:'stack tight'}, h('p', {class:'prompt'}, 'Which word means:'), h('div', {class:'meaning'}, m)),
        choices: C.shuffle([word, e.not.word]).map(w => ({v:w, label:w})), answer: own ? word : e.not.word, layout:'two', alike:true};
    }
    case 'syn': return {top: h('div', {class:'stack tight'}, h('p', {class:'prompt'}, 'Which word means the same as'), h('div', {class:'big'}, word.toUpperCase())),
      choices: C.shuffle(e.syn.choices).map(c => ({v:c, label:c})), answer: e.syn.answer};
    case 'rev': return {top: h('div', {class:'stack tight'}, h('p', {class:'prompt'}, 'Which word means the same as'), h('div', {class:'big'}, e.rev.stem)),
      choices: C.shuffle(e.rev.choices).map(c => ({v:c, label:c})), answer: e.rev.answer};
    case 'sc': case 'ctx': case 'pred': {
      const s = item.k === 'sc' ? e.sc : C.scItem(e, item.ci);
      return {top: h('div', {class:'stack tight'}, h('p', {class:'prompt'}, 'Which word fits the sentence best?'), h('div', {class:'sentence', html: blankHTML(s.sentence)})),
        choices: C.shuffle(s.choices).map(c => ({v:c, label:c})), answer: s.answer, sentence: s.sentence};
    }
  }
  return prep(Object.assign({}, item, {k:'meaning'}), e);
}
function choiceList(P, onPick){
  const letters = 'ABCD';
  const list = h('div', {class:'choices' + (P.layout ? ' ' + P.layout : ''), role:'group', 'aria-label':'Choices'});
  P.choices.forEach((c, i) => {
    const b = h('button', {type:'button', class:'choice', 'data-v': c.v, onclick: () => onPick(c, b)},
      P.layout ? null : h('span', {class:'ltr', 'aria-hidden':'true'}, letters[i]),
      h('span', null, c.label),
      h('span', {class:'mark', html: ICON.check}));
    list.append(b);
  });
  return list;
}
function markChoices(list, answer, pickedBtn, ok){
  list.querySelectorAll('.choice').forEach(x => {
    x.disabled = true;
    if(x.dataset.v === answer){ x.classList.add('right'); x.setAttribute('aria-label', x.textContent + ', the right answer'); }
  });
  if(!ok && pickedBtn){ pickedBtn.classList.add('wrong'); pickedBtn.querySelector('.mark').innerHTML = ICON.cross; pickedBtn.setAttribute('aria-label', pickedBtn.textContent + ', your answer'); }
}
function revealFeedback(fb, box){
  fb.append(box);
  const nb = $('#btnNext');
  if(nb){ try{ nb.focus({preventScroll:true}); }catch(e){} }
  try{ box.scrollIntoView({behavior: reduceMotion() ? 'auto' : 'smooth', block:'nearest'}); }catch(e){}
}
function renderQ(area, item){
  const e = C.BY.get(item.w);
  if(!e){ skipItem(); return; }
  if(item.k === 'type'){ renderType(area, item, e); return; }
  if(item.k === 'pred'){ renderPred(area, item, e); return; }
  const P = prep(item, e);
  cur.answer = P.answer;
  area.append(h('div', {class:'kind'}, kindLabel(item)), P.top);
  const fb = h('div', {id:'fb'});
  let done = false;
  const list = choiceList(P, (c, b) => {
    if(done) return; done = true;
    const ok = c.v === P.answer;
    markChoices(list, P.answer, b, ok);
    let picked = c.v;
    if(item.k === 'meaning'){ const pw = C.BANK.find(x => x.meaning === c.v); picked = pw ? pw.word : c.v; }
    if(item.k === 'feel') picked = signOf(c.v).word;
    const out = onAnswer(item, ok, picked);
    revealFeedback(fb, feedback({item, e, ok, out, P, picked: c.v}));
  });
  area.append(list, fb);
}
function renderPred(area, item, e){
  item.sub = item.sub || {};
  const s = C.scItem(e, item.ci);
  area.append(h('div', {class:'kind'}, kindLabel(item)));
  if(!item.sub.shown){
    cur.phase = 'predict'; cur.answer = s.answer;
    const inp = h('input', {id:'predIn', type:'text', autocomplete:'off', autocapitalize:'none', autocorrect:'off', spellcheck:'false', maxlength:'40', enterkeyhint:'next'});
    const go = () => {
      const t = inp.value.trim().slice(0, 40);
      item.sub.shown = 1; item.sub.mine = t;
      if(t){ state.pred.push([C.dayNum(K()), item.w, t]); if(state.pred.length > 100) state.pred.splice(0, state.pred.length - 100); }
      persist(); show('session');
    };
    inp.addEventListener('keydown', ev => { if(ev.key === 'Enter'){ ev.preventDefault(); go(); } });
    area.append(h('p', {class:'prompt'}, 'Read the sentence. Think of a word that fits.'),
      h('div', {class:'sentence', html: blankHTML(s.sentence)}),
      h('div', {class:'field'}, h('label', {for:'predIn'}, 'Your own word'), inp, h('span', {class:'hint'}, 'You can leave this empty.')),
      btn('primary block', 'Show choices', go, {id:'btnShowChoices'}));
    return;
  }
  const P = prep(item, e);
  cur.answer = P.answer; cur.phase = 'choose';
  area.append(P.top);
  if(item.sub.mine) area.append(h('p', {class:'muted small'}, 'Your word: ' + item.sub.mine));
  const fb = h('div', {id:'fb'});
  let done = false;
  const list = choiceList(P, (c, b) => {
    if(done) return; done = true;
    const ok = c.v === P.answer;
    markChoices(list, P.answer, b, ok);
    const out = onAnswer(item, ok, c.v);
    revealFeedback(fb, feedback({item, e, ok, out, P, picked: c.v}));
  });
  area.append(list, fb);
}
function renderType(area, item, e){
  cur.answer = e.word;
  area.append(h('div', {class:'kind'}, kindLabel(item)));
  area.append(h('p', {class:'prompt'}, 'Type the word.'));
  area.append(h('div', {class:'card stack tight'},
    h('div', {class:'meaning'}, e.meaning),
    h('div', {class:'muted'}, cap(e.pos) + ' · starts with “' + e.word[0] + '” · ' + plural(e.word.length, 'letter'))));
  const inp = h('input', {id:'typeIn', class:'typein', type:'text', autocomplete:'off', autocapitalize:'none', autocorrect:'off', spellcheck:'false', enterkeyhint:'done', 'aria-label':'Type the word', maxlength:'40'});
  const fb = h('div', {id:'fb'});
  let done = false;
  const go = () => {
    if(done) return;
    if(!/[a-z]/i.test(inp.value)){ inp.focus(); return; }
    done = true; inp.readOnly = true; check.disabled = true;
    const r = C.checkTyped(e.word, inp.value, e.not && e.not.word);
    const out = onAnswer(item, r.ok, r.typed);
    revealFeedback(fb, feedback({item, e, ok: r.ok, out, typed: r, P: {answer: e.word}}));
  };
  inp.addEventListener('keydown', ev => { if(ev.key === 'Enter'){ ev.preventDefault(); go(); } });
  const check = btn('primary block', 'Check', go, {id:'btnCheck'});
  area.append(h('div', {class:'field'}, inp), check, fb);
  setTimeout(() => { try{ inp.focus({preventScroll:true}); }catch(e){} }, 60);
}
function feedback(o){
  const {item, e, ok, out, P} = o;
  const box = h('div', {class:'feedback ' + (ok ? 'ok' : 'no'), role:'status'});
  const close = o.typed && ok && !o.typed.exact;
  box.append(h('div', {class:'h', html: (ok ? ICON.check : ICON.cross) + '<span>' + (ok ? 'Right.' : 'Not yet.') + '</span>'}));
  // the right answer
  if(item.k === 'type'){
    if(close) box.append(h('div', null, 'Check the spelling: ', h('b', null, e.word), '.'));
    else if(!ok) box.append(h('div', null, o.typed && o.typed.typed ? 'You typed ' + o.typed.typed + '. ' : '', 'The word is ', h('b', null, e.word), '.'));
  } else if(item.k === 'feel'){
    box.append(h('div', null, h('b', null, cap(e.word)), ' is ' + signOf(e.sign).word + ' because it means ' + e.meaning + '.'));
  } else if(item.k === 'alike' && P.alike){
    if(!ok) box.append(h('div', null, 'The answer is ', h('b', null, P.answer), '.'));
  } else if(!ok && item.k !== 'meaning'){
    box.append(h('div', null, 'The answer is ', h('b', null, P.answer), '.'));
  }
  const fx = h('div', {class:'fx'});
  fx.append(h('div', {class:'row nowrap', style:'align-items:flex-start'},
    h('div', {class:'grow'}, h('b', null, e.word), h('span', {class:'muted nb'}, ' (' + e.say + ')'), ': ' + e.meaning), speakBtn(e.word)));
  if(item.k === 'alike' && e.not) fx.append(h('div', null, h('b', null, e.not.word), ': ' + e.not.meaning));
  if(P.sentence) fx.append(h('div', {class:'example', html: filledHTML(P.sentence, P.answer)}));
  else fx.append(h('div', {class:'example', html: exampleHTML(e)}));
  const mine = state.sent[e.word];
  if(mine && mine.t) fx.append(h('div', {class:'small'}, h('b', null, 'Your sentence: '), mine.t));
  if(state.hooks[e.word]) fx.append(h('div', {class:'small'}, h('b', null, 'Your memory hook: '), state.hooks[e.word]));
  if(out && out.trap && e.not) fx.append(h('div', {class:'trap'}, h('b', null, 'Look-alike trap: '), e.not.word + ' means ' + e.not.meaning + '.'));
  if(item.k === 'feel' && !ok) fx.append(h('div', null, 'Judge the feeling from the meaning, not the sound.'));
  if(item.k === 'type' && !ok) fx.append(h('div', null, 'Typing is harder than choosing. This word will come back sooner.'));
  if(out && out.moved) fx.append(h('div', {class:'next'}, movedLine(out.moved.iv)));
  box.append(fx);
  box.append(btn('gold block big', 'Next', nextItem, {id:'btnNext'}));
  return box;
}

/* ---------- her own words ---------- */
function answerMy(m, typed, ok){
  const k = K();
  C.answerMine(state, m, typed, ok, k);
  C.record(state, 'my', ok, k);
  live.ap = live.pos; live.answered++; if(ok) live.right++;
  persist();
  return m.due ? Math.max(1, C.diffDays(k, m.due)) : null;
}
function myFeedback(m, ok, iv, extra){
  const box = h('div', {class:'feedback ' + (ok ? 'ok' : 'no'), role:'status'});
  box.append(h('div', {class:'h', html: (ok ? ICON.check : ICON.cross) + '<span>' + (ok ? 'Right.' : 'Not yet.') + '</span>'}));
  if(extra) box.append(extra);
  const fx = h('div', {class:'fx'});
  fx.append(h('div', null, h('b', null, m.w), ': ' + m.m));
  if(m.sen) fx.append(h('div', {class:'example'}, m.sen));
  if(iv) fx.append(h('div', {class:'next'}, movedLine(iv)));
  box.append(fx, btn('gold block big', 'Next', nextItem, {id:'btnNext'}));
  return box;
}
function renderMy(area, item){
  const m = state.my.find(x => x.id === item.id);
  if(!m){ skipItem(); return; }
  if(item.k === 'type' && m.w && m.m){
    cur.answer = m.w;
    area.append(h('div', {class:'kind'}, 'My word · Type it'));
    area.append(h('p', {class:'prompt'}, 'Type your word for this meaning.'));
    area.append(h('div', {class:'card stack tight'}, h('div', {class:'meaning'}, m.m),
      h('div', {class:'muted'}, 'Starts with “' + m.w[0] + '” · ' + plural(m.w.length, 'letter'))));
    const inp = h('input', {id:'typeIn', class:'typein', type:'text', autocomplete:'off', autocapitalize:'none', autocorrect:'off', spellcheck:'false', enterkeyhint:'done', 'aria-label':'Type your word', maxlength:'40'});
    const fb = h('div', {id:'fb'});
    let done = false;
    const go = () => {
      if(done) return;
      if(!/[a-z]/i.test(inp.value)){ inp.focus(); return; }
      done = true; inp.readOnly = true; check.disabled = true;
      const r = C.checkTyped(m.w, inp.value);
      const iv = answerMy(m, true, r.ok);
      const extra = r.ok && !r.exact ? h('div', null, 'Check the spelling: ', h('b', null, m.w), '.') : (!r.ok ? h('div', null, 'The word is ', h('b', null, m.w), '.') : null);
      revealFeedback(fb, myFeedback(m, r.ok, iv, extra));
    };
    inp.addEventListener('keydown', ev => { if(ev.key === 'Enter'){ ev.preventDefault(); go(); } });
    const check = btn('primary block', 'Check', go, {id:'btnCheck'});
    area.append(h('div', {class:'field'}, inp), check, fb);
    setTimeout(() => { try{ inp.focus({preventScroll:true}); }catch(e){} }, 60);
    return;
  }
  cur.answer = true; cur.phase = 'self';
  area.append(h('div', {class:'kind'}, 'My word'));
  area.append(h('div', {class:'row nowrap'}, h('div', {class:'big grow'}, m.w.toUpperCase()), speakBtn(m.w)));
  area.append(h('p', {class:'prompt'}, 'What does it mean? Think, then check.'));
  const notes = h('div', {class:'card stack tight', hidden:true},
    h('div', null, h('div', {class:'lbl'}, 'My meaning'), h('div', {class:'meaning'}, m.m || 'No meaning saved yet.')),
    m.sen ? h('div', null, h('div', {class:'lbl'}, 'My sentence'), h('div', {class:'example'}, m.sen)) : null,
    m.src ? h('div', {class:'muted small'}, 'Found in: ' + m.src) : null);
  const fb = h('div', {id:'fb'});
  let done = false;
  const grade = ok => {
    if(done) return; done = true;
    gradeRow.hidden = true;
    const iv = answerMy(m, false, ok);
    revealFeedback(fb, myFeedback(m, ok, iv));
  };

/* ---------- story ---------- */
function passageNode(p){ return h('div', {class:'passage'}, String(p.text).split(/\n\s*\n/).map(t => h('p', null, t))); }
function wordChips(words, st){
  st = st || state;
  const tip = h('div', {class:'wordtip', hidden:true, 'aria-live':'polite'});
  const chips = h('div', {class:'chips'});
  words.forEach(w => {
    const e = C.BY.get(w); if(!e) return;
    const b = h('button', {type:'button', class:'chip', 'aria-pressed':'false', onclick: () => {
      const on = b.getAttribute('aria-pressed') !== 'true';
      chips.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', 'false'));
      if(on){ b.setAttribute('aria-pressed', 'true'); tip.hidden = false; tip.innerHTML = ''; tip.append(h('b', null, e.word), ': ' + e.meaning); }
      else tip.hidden = true;
    }}, w);
    chips.append(b);
  });
  return h('div', {class:'stack tight'}, chips, tip);
}
function renderStory(area, item){
  const p = C.PASSAGES.find(x => x.id === item.id);
  if(!p){ skipItem(); return; }
  const k = K();
  item.sub = item.sub || {ph:'read', i:0, r:0, a:0, pick:null};
  const S = item.sub, n = p.questions.length;
  area.append(h('div', {class:'kind'}, 'Story'));
  if(S.ph === 'read'){
    cur.phase = 'read';
    area.append(h('h2', {class:'story-title'}, p.title), passageNode(p),
      h('p', {class:'muted small'}, 'Then ' + plural(n, 'question') + ' about it.'),
      btn('gold block big', 'I have read it', () => { S.ph = 'q'; persist(); show('session'); }, {id:'btnRead'}));
    return;
  }
  if(S.ph === 'end'){
    cur.phase = 'end';
    area.append(h('h2', {class:'story-title'}, p.title),
      h('p', null, S.r + ' of ' + n + ' right.'),
      h('div', {class:'lbl'}, 'Words from this story'), h('p', {class:'muted small'}, 'Tap a word to see its meaning.'),
      wordChips(p.words),
      btn('gold block big', 'Next', nextItem, {id:'btnNext'}));
    return;
  }
  const q = p.questions[S.i];
  cur.phase = 'question'; cur.answer = q.answer;
  area.append(h('details', {class:'reread'}, h('summary', null, 'Read the story again'), passageNode(p)));
  area.append(h('div', {class:'muted small'}, 'Question ' + (S.i + 1) + ' of ' + n), h('div', {class:'sentence'}, q.stem));
  const fb = h('div', {id:'fb'});
  const P = {choices: C.shuffle(q.choices).map(c => ({v:c, label:c}))};
  const finishQ = () => {
    S.i++; S.a = 0; S.pick = null;
    if(S.i >= n){
      C.finishStory(state, p.id, S.r, n, k);
      live.ap = live.pos; live.answered += n; live.right += S.r; S.ph = 'end';
    }
    persist(); show('session');
  };
  const fbBox = (ok) => {
    const box = h('div', {class:'feedback ' + (ok ? 'ok' : 'no'), role:'status'});
    box.append(h('div', {class:'h', html: (ok ? ICON.check : ICON.cross) + '<span>' + (ok ? 'Right.' : 'Not yet.') + '</span>'}));
    if(!ok) box.append(h('div', null, 'The answer is ', h('b', null, q.answer), '.'));
    if(q.why) box.append(h('div', {class:'fx'}, h('div', null, q.why)));
    box.append(btn('gold block big', 'Next', finishQ, {id:'btnNext'}));
    return box;
  };
  const list = choiceList(P, (c, b) => {
    if(S.a) return;
    const ok = c.v === q.answer;
    S.a = 1; S.pick = c.v; if(ok) S.r++;
    persist();
    markChoices(list, q.answer, b, ok);
    revealFeedback(fb, fbBox(ok));
  });
  area.append(list, fb);
  if(S.a){   // answered before a reload: show its feedback, do not ask again
    const b = [...list.querySelectorAll('.choice')].find(x => x.dataset.v === S.pick);
    const ok = S.pick === q.answer;
    markChoices(list, q.answer, b, ok);
    fb.append(fbBox(ok));
  }
}

/* ---------- word part ---------- */
